[package]
name = "fusb302-pd"
version = "0.1.0"
edition = "2024"
description = "FUSB302 transport with checked startup, gated PD sessions and receive-only sniffing."
license = "MIT OR Apache-2.0"
publish = false

[lib]
# r180: test = false has been here since the crate was vendored (r113) and
# silently zeroed the suite — `cargo test -p fusb302-pd` reported "0 tests"
# while the protocol treats 4/4 as a build gate. The #[cfg(test)] code
# touches no firmware behavior; the gate has to be runnable.
test = true
bench = false

[dependencies]
embedded-hal-async.workspace = true
pd-protocol.workspace = true
usbpd-traits.workspace = true

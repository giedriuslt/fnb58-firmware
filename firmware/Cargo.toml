[package]
name = "fnb58-firmware"
version = "0.1.0"
edition = "2024"
description = "Open firmware scaffold for the FNIRSI FNB58 USB tester (AT32F403A)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "fnb58-firmware"
path = "src/main.rs"
test = false
bench = false

# r167 pdmin probe: USB logging + FUSB302 only, boot-time 9 V request.
[[bin]]
name = "fnb58-pdmin"
path = "src/bin/pdmin.rs"
test = false
bench = false

[dependencies]
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt.workspace = true
embassy-at32.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
embassy-sync.workspace = true
embedded-hal-async.workspace = true
fusb302-pd.workspace = true
qc-protocol.workspace = true
single-wire-protocols.workspace = true
pd-protocol.workspace = true
usbpd.workspace = true
usbpd-traits.workspace = true
heapless = "0.9"
# r199: the ripple analysis crate (kws-x1's firmware-core split, ported).
ripple-core.workspace = true

[workspace]
resolver = "3"
members = ["firmware", "fusb302-pd", "bootloader"]
exclude = ["pd-protocol-debug"]

[workspace.dependencies]
cortex-m = "0.7.10"
cortex-m-rt = "0.7.7"
embassy-at32 = { path = "../at32f403a-embassy-rs/embassy", features = ["rt", "critical-section-single-core"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000"] }
embassy-sync = "0.8.0"
embedded-hal-async = "1.0.0"
fusb302-pd = { path = "fusb302-pd" }
# r189: the QC2.0 trigger consumes the vendored pure-logic crate
# (handshake/requests/follow — the same one kws-x1 drives).
qc-protocol = { path = "pd-protocol-debug/qc-protocol" }
# r198: the AFC trigger consumes the single-wire-protocols crate
# (AFC/SCP/FCP detection and output control — the same family kws-x1 uses).
single-wire-protocols = { git = "https://github.com/kralonur/embedded-charging-protocols-rs", rev = "cdd1101" }
# The sink engine (Selection/Trial/Limits) and the driver traits, pinned to
# the revisions kws-x1 ships against.
pd-protocol = { git = "https://github.com/kralonur/embedded-charging-protocols-rs", rev = "2c3d511cb7214f1db9f5e3528900e1fd9d1bc323" }
usbpd = { git = "https://github.com/kralonur/usbpd", rev = "16b13a23dafad6c5dd0c18801ee978b785730f83" }
usbpd-traits = { git = "https://github.com/kralonur/usbpd", rev = "16b13a23dafad6c5dd0c18801ee978b785730f83" }

# r158 debug: vendored pd-protocol with dtrace instrumentation (host tests)
[patch."https://github.com/kralonur/embedded-charging-protocols-rs"]
pd-protocol = { path = "pd-protocol-debug/pd-protocol" }

# r174: vendored usbpd-traits — the SenderResponseTimer widened 30 -> 100 ms
# (the r173 log: this charger Accepts a re-Request slower than the spec's
# 24-30 ms, so the spec-mandated Hard Reset killed every contract change).
[patch."https://github.com/kralonur/usbpd"]
usbpd-traits = { path = "vendor/usbpd-traits" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
